<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>
    <style>
        body {
            background-color: rgb(104, 143, 143);
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .signup-container {
            background-color: #ffffff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            width: 100%;
            max-width: 320px;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            font-size: 1.5rem;
            color: #333;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: #444;
        }

        input {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 0.6rem;
            background-color: rgb(104, 143, 143);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 0.5rem;
        }

        button:hover {
            opacity: 0.9;
        }

        .signin-text {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <div class="signup-container">
        <h1>Create a new Account</h1>
        <form action="login.html" method="POST">
            <div class="form-group">
                <label for="username">Enter your name</label>
                <input type="text" name="username" id="username" placeholder="John Doe" required>
            </div>

            <div class="form-group">
                <label for="password">Enter password</label>
                <input type="password" name="password" id="password" placeholder="••••••••" required autocomplete="new-password">
            </div>

            <button type="submit">Sign up</button>

            <p class="signin-text">
                Already have an account? <a href="login.html">Sign in</a>
            </p>
        </form>
    </div>

</body>
</html>
